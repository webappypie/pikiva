name: pikiva
description: "Pikiva — private photo curation and template-driven memories."
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.1
  flutter: '>=3.47.1'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.1
  intl: ^0.20.2
  shared_preferences: 2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/samples/
